authors = []
version = "0.1.0"

[tool.poetry.dependencies]
python = ">=3.9,<4.0"
awswrangler = '~3.1'
pandas = ">1.5.0,<3.0.0"
numpy = ">=1.18"
seaborn = ">=0.11.2,<0.12"
matplotlib = ">=3.4.3,<4"
pydantic = ">=2.0"
requests = ">=2.28"
great-expectations = "^0.18.0"
