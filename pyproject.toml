[tool.poetry]
name = "aprovan_data_science"
description = "Core data science repository"
authors = []
version = "0.1.0"
packages = [
    { include = "onkia", from = "src" },
]

[tool.poetry.dependencies]
python = ">=3.9,<4.0"
awswrangler = '~3.1'
pandas = ">1.5.0,<3.0.0"
numpy = ">=1.18"
seaborn = ">=0.11.2,<0.14"
matplotlib = ">=3.4.3,<4"
pydantic = ">=2.0"
requests = ">=2.28"
great-expectations = "^0.18.0"
streamlit = ">=1.36"
streamlit-folium = ">=0.15"
marimo = ">=0.11.0"
folium = ">=0.14.0"
xarray = ">=2023.0"
pyarrow = ">=12.0"
scipy = ">=1.10"
pystac-client = ">=0.8"
planetary-computer = ">=1.0"
rioxarray = ">=0.18"
rasterio = ">=1.3"
pyproj = ">=3.4"

[tool.poetry.dev-dependencies]
pytest = "^7.0"
black = {version = "^23.7", allow-prereleases = true}

[tool.poetry.group.dev.dependencies]
ipykernel = "^6.23.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

